<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FCMS PRO · Mất kết nối</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #091b30;
        color: white;
        font: 16px/1.8 system-ui;
      }
      main {
        max-width: 420px;
        padding: 32px;
      }
      img {
        width: 64px;
      }
      p {
        color: #a9c4d4;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        background: #25d99a;
        color: #091b30;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/crest.svg" alt="" />
      <h1>Sẵn sàng khi bạn kết nối lại.</h1>
      <p>
        Kiểm tra kết nối mạng để tải dữ liệu mới nhất của câu lạc bộ. Các giao
        dịch cần có kết nối để được xác nhận.
      </p>
      <a href="/">Kết nối lại</a>
    </main>
  </body>
</html>
